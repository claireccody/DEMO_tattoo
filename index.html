      list-style-type: none;
      margin: 32px 16px;
    }

    .link{
      margin:4px;
      background-color: #ffffff99;
      padding: 4px;
      border-radius: 4px;
      color: white;
      text-shadow: 0 0 4px #0c355d;
      box-shadow: 0 2px 4px #190c5def;
      font-weight: bold;
    }
    .link:hover{
      box-shadow: none;

    .logo__img{

      justify-content: center;
      align-items: center;
    }

    #hero{

      height: 85vh;
    }

      flex-direction: column;
    }
    #gallery_A{

      grid-template-columns: auto auto auto;
      column-gap: 20px;
      row-gap: 20px;

      width: 100%;
      max-width: 728px;

    #gallery_B{

      text-shadow: #000000 0 0 4px;

    .right{

    }

      font-family: 'MyScript', sans-serif;
      font-size: larger;
    }

    @media (max-width: 600px){

      #contact-link
